name: frontend CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: ESLint and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  build-scan:
    name: Build Docker and scan release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build portable standalone frontend
        env:
          NEXT_PUBLIC_API_URL: ''
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Build Docker image
        run: docker build --build-arg NEXT_PUBLIC_API_URL= -t riana-frontend:${{ github.sha }} .
      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git
      - name: Scan built image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: riana-frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Package tested revision
        run: |
          mkdir -p .next/standalone/.next/static
          cp -a .next/static/. .next/standalone/.next/static/
          cp -a public .next/standalone/public
          tar -czf release.tgz -C .next/standalone .
          sha256sum release.tgz > release.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: |
            release.tgz
            release.tgz.sha256
          retention-days: 7
          if-no-files-found: error

  staging:
    name: Migrate and deploy staging
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
      - name: Deploy exact release and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_EC2_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_EC2_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_EC2_SSH_KEY }}
          DEPLOY_HOST_KEYS: ${{ vars.STAGING_SSH_HOST_KEYS }}
        run: bash ops/dispatch.sh staging '${{ github.sha }}'

  production-policy:
    name: Verify production requires approval
    needs: staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/environments/production', context.repo);
            const guarded = (data.protection_rules || []).some(rule =>
              rule.type === 'required_reviewers' && rule.reviewers?.length > 0);
            if (!guarded) core.setFailed('Configure required reviewers on the production environment before deployment.');

  production:
    name: Approved production release
    needs: [build-scan, staging, production-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://smartedu.co.ke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
      - name: Promote staging-tested release and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_HOST_KEYS: ${{ vars.PRODUCTION_SSH_HOST_KEYS }}
        run: bash ops/dispatch.sh production '${{ github.sha }}'
